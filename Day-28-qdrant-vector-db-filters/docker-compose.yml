version: '3.8'

services:
  qdrant_db:
    image: qdrant/qdrant:latest
    container_name: ml_qdrant_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
    restart: always

  search_api:
    build: .
    container_name: ml_qdrant_search_api
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant_db
      - QDRANT_PORT=6333
    depends_on:
      - qdrant_db
    restart: always

volumes:
  qdrant_storage: